@if (!isLoading) {
  @if (filteredCards.length) {
    @for (card of filteredCards; track card._id) {
      <app-card [card]="card" cdkDrag [cdkDragData]="card"> </app-card>
    }
  } @else if (hasActiveFilters) {
    <div class="empty-state">No cards match your filters</div>
  }
} @else {
  <div class="spinner-wrapper">
    <mat-spinner></mat-spinner>
  </div>
}
