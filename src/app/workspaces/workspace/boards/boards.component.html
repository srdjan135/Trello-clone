@for (board of visibleBoards; track board._id) {
  <div
    class="board-card"
    [routerLink]="['/', workspace._id, 'boards', board._id]"
  >
    <div
      class="bg"
      [style.backgroundImage]="'url(' + board.background + ')'"
    ></div>
    <p>{{ board.title }}</p>
  </div>
} @empty {
  @if (!isAdmin) {
    <p>You are not currently on any board.</p>
  }
}

@if (isAdmin) {
  <app-create-board
    [workspace]="workspace"
    (newBoard)="updateBoardsList($event)"
  ></app-create-board>
}
