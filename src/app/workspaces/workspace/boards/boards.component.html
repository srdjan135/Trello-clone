@for (board of sortedBoards; track board._id) {
  <div
    class="board-card"
    [routerLink]="['/', workspace._id, 'boards', board._id]"
  >
    <div
      class="bg"
      [style.backgroundImage]="'url(' + board.background + ')'"
    ></div>
    <p>{{ board.title }}</p>
  </div>
}

<app-create-board
  [workspace]="workspace"
  (newBoard)="updateBoardsList($event)"
></app-create-board>
