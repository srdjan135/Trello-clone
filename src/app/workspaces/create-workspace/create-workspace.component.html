<form (submit)="onSubmit(workspaceForm)" #workspaceForm="ngForm">
  <mat-form-field appearance="outline">
    <mat-label>Workspace Name</mat-label>
    <input
      matInput
      type="text"
      placeholder="Workspace Name"
      name="name"
      ngModel
      required
      #name="ngModel"
    />
    @if (name.hasError("required")) {
      <mat-error>Name is required!</mat-error>
    }
  </mat-form-field>
  <mat-form-field appearance="outline">
    <mat-label>Workspace Description</mat-label>
    <textarea
      matInput
      type="text"
      placeholder="Workspace Description"
      rows="5"
      name="description"
      ngModel
    ></textarea>
  </mat-form-field>
  <button mat-flat-button type="submit" [disabled]="workspaceForm.invalid">
    Continue
  </button>
</form>
